name: Deploy Server (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    paths:
      - "Iraqestar.zip"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project
        run: |
          mkdir -p _proj
          unzip -q Iraqestar.zip -d _proj

      - name: Locate server folder
        id: find
        run: |
          WR=$(find _proj -name wrangler.toml -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$WR" ]; then echo "wrangler.toml not found in zip"; exit 1; fi
          echo "dir=$(dirname "$WR")" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ steps.find.outputs.dir }}
          command: deploy --name iraqe-star
