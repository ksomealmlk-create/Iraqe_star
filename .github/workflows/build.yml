name: Build APK (Godot + C++)

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract project from ZIP
        run: |
          Z=$(ls -t *.zip | head -n1)
          echo "Using $Z"
          unzip -o -q "$Z" -d _proj
          P=$(dirname "$(find _proj -name project.godot | head -n1)")
          echo "Project dir: $P"
          cp -a "$P"/. .
          rm -rf _proj
          test -f nujoom.gdextension && test -f project.godot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- Cache: godot-cpp compiled objects (the slowest part) ----
      - name: Restore godot-cpp cache
        uses: actions/cache/restore@v4
        with:
          path: |
            godot-cpp
            .sconsign.dblite
          key: gdcpp-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdcpp-${{ runner.os }}-

      # ---- Cache: Godot editor + export templates ----
      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install tools
        run: |
          python3 -m pip install scons
          which convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Android SDK + NDK (use preinstalled)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          WANT=23.2.8568313
          if [ ! -d "$ANDROID_HOME/ndk/$WANT/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | head -n1)
            echo "Linking $NDK as $WANT (godot-cpp 4.3 looks for this exact name)"
            sudo ln -sfn "$NDK" "$ANDROID_HOME/ndk/$WANT"
          fi
          ls -la $ANDROID_HOME/ndk/
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$WANT" >> $GITHUB_ENV

      - name: Get godot-cpp (only if not cached)
        run: |
          if [ ! -f godot-cpp/SConstruct ]; then
            git clone --depth 1 -b ${GODOT_VERSION} https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Build C++ library (Android arm64, debug only)
        run: |
          mkdir -p bin
          # link the C++ runtime statically so the phone does not need libc++_shared.so
          grep -q "static-libstdc++" SConstruct || sed -i '/env.Append(CPPPATH/a env.Append(LINKFLAGS=["-static-libstdc++"])' SConstruct
          scons platform=android arch=arm64 target=template_debug use_static_cpp=yes -j$(nproc)
          SO=bin/libnujoom.android.template_debug.arm64.so
          echo "--- library info ---"
          readelf -d $SO | grep -E "NEEDED|SONAME" || true
          if readelf -d $SO | grep -q "libc++_shared"; then
            echo "Still needs libc++_shared.so -> shipping it with the game as a dependency"
            cp $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so bin/
            printf '\n[dependencies]\nandroid.debug.arm64 = {"res://bin/libc++_shared.so": ""}\nandroid.release.arm64 = {"res://bin/libc++_shared.so": ""}\n' >> nujoom.gdextension
            cat nujoom.gdextension
          fi
          # the .gdextension also lists a release library; reuse debug one so nothing is missing
          cp $SO bin/libnujoom.android.template_release.arm64.so
          ls -la bin

      # save the compile cache even if a later step fails, so a rerun resumes fast
      - name: Save godot-cpp cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            godot-cpp
            .sconsign.dblite
          key: gdcpp-${{ runner.os }}-${{ github.run_id }}

      - name: Install Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Icon (if missing)
        run: |
          if [ -f new_icon.png ]; then cp new_icon.png icon.png; fi
          if [ ! -f icon.png ]; then
            convert -size 512x512 xc:'#050814' -fill '#ffd24a' -draw "circle 256,256 256,90" icon.png
          fi

      - name: Debug keystore + editor settings + export preset
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres
          cat > export_presets.cfg <<'EOT'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/nujoom.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.nujoom.iraq"
          package/name="نجوم العراق"
          package/signed=true
          version/code=1
          version/name="1.0"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          screen/immersive_mode=true
          permissions/internet=true
          EOT
          sed -i 's/^ *//' export_presets.cfg

      - name: Add boot scene (shows on-screen status if the C++ extension fails)
        run: |
          cat > boot.gd <<'EOT'
          extends Node

          func _ready():
              var lines = []
              lines.append("Godot " + str(Engine.get_version_info()["string"]))
              lines.append("list file: " + str(FileAccess.file_exists("res://.godot/extension_list.cfg")))
              var ok = ClassDB.class_exists("NujoomGame")
              if not ok:
                  var st = GDExtensionManager.load_extension("res://nujoom.gdextension")
                  lines.append("manual load status: " + str(st) + " (0 OK, 1 FAILED, 2 ALREADY, 3 NOT_LOADED, 4 RESTART)")
                  ok = ClassDB.class_exists("NujoomGame")
              lines.append("extensions: " + str(GDExtensionManager.get_loaded_extensions()))
              var info = Label.new()
              info.add_theme_font_size_override("font_size", 34)
              info.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              info.size = Vector2(900, 600)
              info.position = Vector2(30, 60)
              info.z_index = 4000
              if ok:
                  add_child(ClassDB.instantiate("NujoomGame"))
                  info.text = "C++ OK\n" + "\n".join(lines)
                  add_child(info)
                  await get_tree().create_timer(6.0).timeout
                  info.queue_free()
              else:
                  info.text = "NujoomGame NOT found\n" + "\n".join(lines)
                  add_child(info)
          EOT
          cat > boot.tscn <<'EOT'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://boot.gd" id="1"]

          [node name="Boot" type="Node"]
          script = ExtResource("1")
          EOT
          sed -i 's#^run/main_scene=.*#run/main_scene="res://boot.tscn"#' project.godot
          grep main_scene project.godot

      - name: Import + Export APK
        run: |
          export PATH=$HOME/godot-bin:$PATH
          mkdir -p build .godot
          godot --headless --path . --import || true
          # make sure the exported game loads the C++ extension at runtime
          echo "res://nujoom.gdextension" > .godot/extension_list.cfg
          cat .godot/extension_list.cfg
          godot --headless --path . --export-debug "Android" build/nujoom.apk
          ls -la build

      - name: Check APK contains the C++ library
        run: |
          unzip -l build/nujoom.apk | grep -E "libnujoom|libc\+\+|libgodot" || true
          unzip -l build/nujoom.apk | grep -q "libnujoom" || (echo "ERROR: libnujoom.so is NOT inside the APK" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: nujoom-iraq-apk
          path: build/nujoom.apk
